name: Sync Environment Credentials

# Copies signing credentials from one GitHub environment to another so a new or
# re-provisioned environment can build signed, notarized artifacts.
#
# Manual only, and idempotent: re-running it overwrites the target with the
# current source values and is always safe.
#
# Requires a NIGHTLY_ENV_SYNC_TOKEN repository secret holding a PAT with
# `repo` + `admin:org`-level access, because GITHUB_TOKEN cannot write
# environment secrets. By default the token is revoked once the sync finishes,
# so no long-lived admin PAT is left sitting in the repository.

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: Environment to copy credentials FROM
        type: string
        default: release
        required: true
      target_environment:
        description: Environment to copy credentials TO
        type: string
        default: nightly
        required: true
      allow_master_deployments:
        description: Allow master to deploy to the target environment
        type: boolean
        default: true
      revoke_token:
        description: Delete NIGHTLY_ENV_SYNC_TOKEN when the sync finishes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-environment-credentials
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ inputs.source_environment }} credentials to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.source_environment }}
    env:
      GH_TOKEN: ${{ secrets.NIGHTLY_ENV_SYNC_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET_ENV: ${{ inputs.target_environment }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - name: Check sync inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::NIGHTLY_ENV_SYNC_TOKEN is not set. Add a PAT with repository admin"
            echo "::error::access as a repository secret, run this workflow, and it will revoke"
            echo "::error::the token afterwards unless revoke_token is disabled."
            exit 1
          fi

          if [[ "$TARGET_ENV" == "${{ inputs.source_environment }}" ]]; then
            echo "::error::Source and target environments are both '$TARGET_ENV'."
            exit 1
          fi

          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            APPLE_API_PRIVATE_KEY_P8_BASE64 \
            SPARKLE_PRIVATE_ED_KEY \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            SPARKLE_PUBLIC_ED_KEY
          do
            [[ -n "${!name}" ]] || missing+=("$name")
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing in source environment %s: %s\n' \
              "${{ inputs.source_environment }}" "${missing[*]}"
            exit 1
          fi

      - name: Create target environment
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$REPOSITORY/environments/$TARGET_ENV" >/dev/null

      - name: Copy secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            APPLE_API_PRIVATE_KEY_P8_BASE64 \
            SPARKLE_PRIVATE_ED_KEY
          do
            printf '%s' "${!name}" |
              gh secret set "$name" --env "$TARGET_ENV" --repo "$REPOSITORY"
            echo "synced secret $name"
          done

      - name: Copy variables
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            SPARKLE_PUBLIC_ED_KEY
          do
            gh variable set "$name" --env "$TARGET_ENV" --repo "$REPOSITORY" --body "${!name}"
            echo "synced variable $name"
          done

      - name: Allow master to deploy to the target environment
        if: inputs.allow_master_deployments
        shell: bash
        run: |
          set -euo pipefail

          gh api --method PUT "repos/$REPOSITORY/environments/$TARGET_ENV" \
            --input - >/dev/null <<'JSON'
          {"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}
          JSON

          default_branch=$(gh repo view "$REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)

          if gh api "repos/$REPOSITORY/environments/$TARGET_ENV/deployment-branch-policies" \
            --jq '.branch_policies[].name' | grep -Fxq "$default_branch"; then
            echo "branch policy for $default_branch already present"
          else
            gh api --method POST \
              "repos/$REPOSITORY/environments/$TARGET_ENV/deployment-branch-policies" \
              -f name="$default_branch" \
              -f type=branch >/dev/null
            echo "added branch policy for $default_branch"
          fi

      - name: Revoke sync token
        if: always() && inputs.revoke_token
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "no sync token to revoke"
            exit 0
          fi

          gh secret delete NIGHTLY_ENV_SYNC_TOKEN --repo "$REPOSITORY"
          echo "NIGHTLY_ENV_SYNC_TOKEN revoked"
